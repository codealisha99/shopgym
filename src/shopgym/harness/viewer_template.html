<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopGym trajectories</title>
<style>
  :root { --paper:#e7eae4; --deep:#d9ded6; --ink:#17231f; --muted:#56665f; --rule:#bcc7bf; --spruce:#1f4d42; --signal:#c94a1c; --ok:#1f6b4a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 "Avenir Next","Segoe UI",Helvetica,Arial,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { background:var(--spruce); color:var(--paper); padding:.7rem 1.2rem; display:flex; gap:1.2rem; align-items:baseline; }
  header h1 { font:700 1.35rem "Iowan Old Style","Palatino Linotype",Georgia,serif; margin:0; }
  header .muted { color:#bdd0c8; font-size:.9rem; }
  .layout { display:grid; grid-template-columns:320px 1fr; flex:1; min-height:0; }
  aside { border-right:1px solid var(--rule); overflow:auto; background:var(--deep); }
  aside h2 { font-size:.95rem; margin:1rem .9rem .3rem; color:var(--muted); font-weight:700; }
  aside button { display:flex; width:100%; justify-content:space-between; gap:.5rem; background:none; border:0; border-bottom:1px solid var(--rule); padding:.45rem .9rem; text-align:left; font:inherit; color:var(--ink); cursor:pointer; }
  aside button:hover { background:#cfd6cd; }
  aside button.on { background:var(--ink); color:var(--paper); }
  .mark { font-weight:700; white-space:nowrap; }
  .pass { color:var(--ok); } .fail { color:var(--signal); }
  aside button.on .pass { color:#9fe0bd; } aside button.on .fail { color:#ffb294; }
  main { overflow:auto; padding:1.1rem 1.4rem 2rem; min-width:0; }
  h2.task { font:700 1.5rem "Iowan Old Style","Palatino Linotype",Georgia,serif; margin:0 0 .2rem; }
  .instruction { max-width:70ch; margin:0 0 .9rem; }
  .verdict { border-left:4px solid var(--signal); background:#f3e2d9; padding:.5rem .8rem; margin:.6rem 0; max-width:90ch; }
  .verdict.ok { border-color:var(--ok); background:#dcebe2; }
  .controls { display:flex; gap:.6rem; align-items:center; margin:.6rem 0; }
  .controls button { font:inherit; font-weight:700; border:2px solid var(--ink); background:var(--ink); color:var(--paper); padding:.35rem .8rem; border-radius:2px; cursor:pointer; }
  .controls button:disabled { opacity:.35; cursor:default; }
  .controls input[type=range] { flex:1; }
  .grid { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:1.1rem; align-items:start; }
  img.shot { width:100%; border:1px solid var(--rule); background:#fff; display:block; }
  pre { background:#f4f6f2; border:1px solid var(--rule); padding:.6rem .8rem; white-space:pre-wrap; word-break:break-word; font:12.5px/1.45 ui-monospace,Menlo,monospace; margin:0 0 .8rem; max-height:50vh; overflow:auto; }
  .label { font-weight:700; margin:.2rem 0 .25rem; font-size:.9rem; }
  .err { color:var(--signal); font-weight:600; }
  .url { font-family:ui-monospace,Menlo,monospace; font-size:.85rem; color:var(--muted); }
  @media (max-width:1000px) { .layout { grid-template-columns:1fr; } .grid { grid-template-columns:1fr; } aside { max-height:30vh; } }
</style>
</head>
<body>
<header>
  <h1>ShopGym trajectories</h1>
  <span class="muted" id="summary"></span>
</header>
<div class="layout">
  <aside id="list"></aside>
  <main id="main"><p>Select an episode.</p></main>
</div>
<script>
const EPISODES = /*__DATA__*/null;
let current = 0, step = 0;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"}[c]));

function renderList() {
  const passed = EPISODES.filter((e) => e.result.success).length;
  $("summary").textContent = `${passed}/${EPISODES.length} episodes passed`;
  $("list").innerHTML = EPISODES.map((e, i) => {
    const r = e.result;
    const mark = r.success ? '<span class="mark pass">pass</span>' : '<span class="mark fail">fail</span>';
    return `<button data-i="${i}" class="${i === current ? "on" : ""}"><span>${esc(r.agent)} / ${esc(r.task)}</span>${mark}</button>`;
  }).join("");
  $("list").querySelectorAll("button").forEach((b) => b.onclick = () => select(Number(b.dataset.i)));
}

function select(i) { current = i; step = 0; renderList(); renderMain(); }

function renderMain() {
  const e = EPISODES[current];
  if (!e) return;
  const r = e.result, f = e.frames[step], last = e.frames.length - 1;
  const verdict = r.verdict && r.verdict.reason ? `<div class="verdict ${r.success ? "ok" : ""}">Checker: ${esc(r.verdict.reason)}${r.crash ? ` · crash: ${esc(r.crash)}` : ""}${r.truncated ? " · step budget ran out" : ""}</div>` : "";
  $("main").innerHTML = `
    <h2 class="task">${esc(r.task)}</h2>
    <p class="instruction">${esc(r.instruction)}</p>
    <div class="muted">${esc(r.agent)} · tier ${esc(r.tier)} · seed ${r.seed} · ${r.steps} steps · reward ${r.reward}</div>
    ${verdict}
    <div class="controls">
      <button id="prev" ${step === 0 ? "disabled" : ""}>Previous</button>
      <input id="scrub" type="range" min="0" max="${last}" value="${step}" aria-label="Step">
      <button id="next" ${step === last ? "disabled" : ""}>Next</button>
      <span class="muted">step ${step} of ${last}</span>
    </div>
    <div class="grid">
      <div>
        <div class="url">${esc(f.url)}</div>
        <img class="shot" alt="Screenshot at step ${step}" src="${f.shot}">
      </div>
      <div>
        <div class="label">Action</div>
        <pre>${f.action === null ? "(episode end)" : esc(JSON.stringify(f.action, null, 2))}</pre>
        ${f.error ? `<div class="err">Last action failed: ${esc(f.error)}</div>` : ""}
        ${f.result_error ? `<div class="err">Result: ${esc(f.result_error)}</div>` : ""}
        <div class="label">Observation (what the agent saw)</div>
        <pre>${esc(f.text)}</pre>
      </div>
    </div>`;
  $("prev").onclick = () => go(step - 1);
  $("next").onclick = () => go(step + 1);
  $("scrub").oninput = (ev) => go(Number(ev.target.value));
}

function go(n) {
  const max = EPISODES[current].frames.length - 1;
  step = Math.max(0, Math.min(max, n));
  renderMain();
}

document.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "INPUT" && ev.target.type !== "range") return;
  if (ev.key === "ArrowRight") go(step + 1);
  if (ev.key === "ArrowLeft") go(step - 1);
});

renderList();
if (EPISODES.length) renderMain();
</script>
</body>
</html>
