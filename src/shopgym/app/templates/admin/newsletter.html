{% extends "admin/_layout.html" %}
{% block admin %}
<h1>Newsletter subscribers</h1>
<table>
  <thead><tr><th scope="col">Email</th><th scope="col">Status</th><th scope="col">Joined</th></tr></thead>
  <tbody>{% for s in subscribers %}<tr><td>{{ s['email'] }}</td><td>{{ 'Active' if s['active'] else 'Unsubscribed' }}</td><td>{{ s['created_at'][:10] }}</td></tr>{% endfor %}</tbody>
</table>
{% endblock %}
