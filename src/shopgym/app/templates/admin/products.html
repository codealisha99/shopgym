{% extends "admin/_layout.html" %}
{% block admin %}
<h1>Products</h1>
<form method="get" action="/admin/products" class="toolbar">
  <div class="field"><label for="pq">Name or SKU</label><input id="pq" name="q" type="search" value="{{ q }}"></div>
  <button type="submit" class="ghost">Search</button>
</form>
<table>
  <thead><tr><th scope="col">SKU</th><th scope="col">Name</th><th scope="col">Department</th><th scope="col" class="num">Price</th><th scope="col" class="num">Stock</th><th scope="col"><span class="sr">Edit</span></th></tr></thead>
  <tbody>
  {% for p in products %}
  <tr>
    <td>{{ p['sku'] }}</td><td>{{ p['name'] }}</td><td>{{ p['category_name'] }}</td>
    <td class="num">{{ p['price_cents'] | money }}</td><td class="num">{{ p['stock'] }}</td>
    <td><a href="/admin/products/{{ p['sku'] }}">Edit</a></td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
